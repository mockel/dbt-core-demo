env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_TARGET_DB: "HOMA_DB"
        DBT_TARGET_SCHEMA: "DBT_MHOFFHUES"
        DBT_TARGET_WH: "HOMA_WH"
        DBT_TARGET_ROLE: "ACCOUNTADMIN"
    - name: prod
      env:
        DBT_TARGET_DB: "HOMA_DB"
        DBT_TARGET_SCHEMA: "DBT_PROD"
        DBT_TARGET_WH: "HOMA_WH"
        DBT_TARGET_ROLE: "ACCOUNTADMIN"
